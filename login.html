<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - EduSafe</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="phone-screen">
    <div class="shield-icon">🛡️</div>
    <h3>Welcome back</h3>
    <p class="subtext">Enter your details to continue</p>

    <form class="login-form" id="loginForm">
      <label>Email address</label>
      <input type="email" id="loginEmail" placeholder="name@example.com" required />

      <label>Password</label>
      <input type="password" id="loginPassword" placeholder="••••••••" required />

      <div class="remember-row">
        <label><input type="checkbox" id="rememberMe" style="width:auto; display:inline;" /> Remember this device</label>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary full-width">Log In</button>
    </form>

    <p class="signup-link">New here? <a href="signup.html">Create account</a></p>
  </div>
  <script src="main.js"></script>
</body>
</html>
