<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard - EduSafe</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div class="phone-screen" style="text-align:left;">
    <span class="badge" id="userRole">Student</span>
    <h4 id="welcomeMessage">Welcome back, Alex</h4>
    <p class="subtext">Continue where you left off</p>

    <div class="card">
      <div class="card-title">Algebra Basics — Lesson 4</div>
      <p class="card-subtext">Mathematics · 12 lessons</p>
    </div>

    <div class="card-row">
      <div class="card">
        <div class="card-title">4</div>
        <p class="card-subtext">My courses</p>
      </div>
      <div class="card">
        <div class="card-title">2</div>
        <p class="card-subtext">Assignments due</p>
      </div>
    </div>

    <button id="logoutBtn" class="btn-secondary full-width" style="margin-top:16px;">Log Out</button>
  </div>
  <script src="main.js"></script>  <!-- ✅ Changed this -->
</body>
</html>
